services:
  # 1. PostgreSQL 16 Durable Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: simple-trader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
      - ./migrations/000002_investor_ledger.up.sql:/docker-entrypoint-initdb.d/002_investor_ledger.sql:ro
      - ./migrations/000003_futures_auth_telegram.up.sql:/docker-entrypoint-initdb.d/003_futures_auth_telegram.sql:ro
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 In-Memory Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: simple-trader-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Pure Go 1.24 Backend (Prebuilt Image from GitHub Container Registry)
  backend:
    image: ghcr.io/rqzbeh/simple-trader-backend:latest
    container_name: simple-trader-backend
    restart: unless-stopped
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: ${PORT:?PORT required in .env}
      # Compose builds the internal Docker-network URLs — they MUST point to
      # the service hostnames (postgres/redis), not localhost from .env.
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB required}?sslmode=disable
      REDIS_URL: "redis://redis:6379/0"
      ENV: "production"
      ENV_FILE: "/.env"
    volumes:
      - ./.env:/.env
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
