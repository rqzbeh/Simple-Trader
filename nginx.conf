# Simple-Trader VPS Host Nginx Reverse Proxy Configuration
# Place this configuration into /etc/nginx/sites-available/simple-trader
# and link to /etc/nginx/sites-enabled/simple-trader
# (or directly into /etc/nginx/conf.d/simple-trader.conf)

upstream simple_trader_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain-or-ip.com; # Change to your domain or server IP

    # Gzip Compression for High Throughput
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Client body buffers
    client_max_body_size 20M;

    # 1. Health Check Endpoint
    location /health {
        proxy_pass http://simple_trader_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Real-Time Server-Sent Events (SSE) Stream
    location /api/v1/events {
        proxy_pass http://simple_trader_backend/api/v1/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering for zero-latency streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. REST API Routes
    location /api/ {
        proxy_pass http://simple_trader_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 4. Frontend Web UI (PWA) Direct Reverse Proxy to Backend
    # The Go backend directly serves static assets from /app/web/dist or local dist directory
    location / {
        proxy_pass http://simple_trader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
