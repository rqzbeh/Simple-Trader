services:
  # 1. PostgreSQL 16 Durable Database
  postgres:
    image: postgres:16-alpine
    container_name: simple-trader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_secret}
      POSTGRES_DB: ${POSTGRES_DB:-simple_trader}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
      - ./migrations/000002_investor_ledger.up.sql:/docker-entrypoint-initdb.d/002_investor_ledger.sql:ro
      - ./migrations/000003_futures_auth_telegram.up.sql:/docker-entrypoint-initdb.d/003_futures_auth_telegram.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader} -d ${POSTGRES_DB:-simple_trader}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 High-Speed In-Memory Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: simple-trader-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Pure Go 1.24 Autonomous Backend Engine (Prebuilt GHCR image with local build fallback)
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/rqzbeh/simple-trader-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: simple-trader-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD:-trader_secret}@postgres:5432/${POSTGRES_DB:-simple_trader}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL_ID: ${AI_MODEL_ID:-gpt-4o}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-high}
      INITIAL_CAPITAL: ${INITIAL_CAPITAL:-100000.0}
      CORE_TARGET_PCT: ${CORE_TARGET_PCT:-0.45}
      ALPHA_TARGET_PCT: ${ALPHA_TARGET_PCT:-0.40}
      MAX_DRAWDOWN_LIMIT_PCT: ${MAX_DRAWDOWN_LIMIT_PCT:-0.10}
      MAX_RISK_PER_TRADE_PCT: ${MAX_RISK_PER_TRADE_PCT:-0.02}
      MIN_RISK_PER_TRADE_PCT: ${MIN_RISK_PER_TRADE_PCT:-0.005}
      KELLY_FRACTION: ${KELLY_FRACTION:-0.50}
      MAX_CONCURRENT_SIGNALS: ${MAX_CONCURRENT_SIGNALS:-5}
      MIN_RISK_TO_REWARD_RATIO: ${MIN_RISK_TO_REWARD_RATIO:-2.5}
      DEFAULT_LEVERAGE: ${DEFAULT_LEVERAGE:-8}
      MIN_STOP_LOSS_PCT: ${MIN_STOP_LOSS_PCT:-0.6}
      MAX_STOP_LOSS_PCT: ${MAX_STOP_LOSS_PCT:-2.5}
      MIN_TAKE_PROFIT_PCT: ${MIN_TAKE_PROFIT_PCT:-1.5}
      MAX_TAKE_PROFIT_PCT: ${MAX_TAKE_PROFIT_PCT:-8.0}
      MAKER_FEE_RATE: ${MAKER_FEE_RATE:-0.0002}
      TAKER_FEE_RATE: ${TAKER_FEE_RATE:-0.0005}
      MAX_SLIPPAGE_PCT: ${MAX_SLIPPAGE_PCT:-0.05}
      IMPACT_FACTOR: ${IMPACT_FACTOR:-0.05}
      CALENDAR_HALT_MINUTES: ${CALENDAR_HALT_MINUTES:-15}
      ECONOMIC_CALENDAR_URL: ${ECONOMIC_CALENDAR_URL:-https://nfs.faireconomy.media/ff_calendar_thisweek.json}
      SCREENER_MIN_24H_VOLUME: ${SCREENER_MIN_24H_VOLUME:-50000000.0}
      SCREENER_MAX_SPREAD_BPS: ${SCREENER_MAX_SPREAD_BPS:-10.0}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_SECRET: ${APP_SECRET:-}
      ENV: "production"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
