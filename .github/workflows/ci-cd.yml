name: CI/CD & Container Registry Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    name: Test (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - ./internal/server
          - ./internal/auth
          - ./internal/ai
          - ./internal/trader
          - ./internal/market
          - ./internal/db
          - ./internal/cache
          - ./internal/indicators
          - ./internal/config
          - ./internal/backtest
          - ./internal/telegram
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Run Package Tests (race detector)
        run: go test -race -count=1 ${{ matrix.pkg }}

  backend-verify:
    name: Backend Lint, Guard & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Zero-Fallback Deletion Guards (spec-013 FR-007a/FR-013)
        run: |
          if grep -rn --include='*.go' -E 'fallbackHeuristic|AnalyzeNewsSentiment|bullishTerms|bearishTerms' internal/ | grep -v deleted_test; then
            echo "::error::Deleted fallback/lexicon symbols reappeared"
            exit 1
          fi

      - name: Migration Naming Check (root migrations/ dual-directory rule)
        run: |
          ls migrations/*.up.sql >/dev/null 2>&1 || { echo "::error::no root migrations"; exit 1; }

      - name: Compile Static Go Binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-w -s" -o ./bin/simple-trader ./cmd/trader/main.go

  frontend-verify:
    name: Frontend Test & Build (Bun)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: bun install --frozen-lockfile

      - name: Run Frontend Tests
        working-directory: ./web
        run: bun test

      - name: Build Frontend PWA
        working-directory: ./web
        run: bun run build

  publish-images:
    name: Build & Publish Prebuilt Docker Images to GHCR
    needs: [backend-test, backend-verify, frontend-verify]
    # Only build and publish if all tests passed (green) and commit is on main or tag
    if: success() && ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Lowercase Image Names
        run: |
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${REPO_OWNER_LOWER}/simple-trader-backend" >> $GITHUB_ENV

      - name: Extract Docker metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
