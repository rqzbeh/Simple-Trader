<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="100%" height="100%">
  <defs>
    <linearGradient id="navBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="navPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="navShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-ui { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Frame Background -->
  <rect width="920" height="370" rx="14" fill="url(#navBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Left: Unitized NAV Principles -->
  <g transform="translate(25, 25)" filter="url(#navShadow)">
    <rect width="425" height="320" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" />

    <g transform="translate(20, 20)">
      <text class="font-ui" font-size="16" font-weight="800" fill="#ffffff">UNITIZED NAV INVESTOR ACCOUNTING</text>
      <text class="font-ui" font-size="11" fill="#94a3b8" y="20">Wall-Street standard zero-dilution multi-tenant ledger</text>
    </g>

    <!-- Formula Box -->
    <g transform="translate(20, 60)">
      <rect width="385" height="65" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
      <text class="font-mono" font-size="11" font-weight="700" fill="#34d399" x="14" y="22">NET ASSET VALUE (NAV) FORMULA:</text>
      <text class="font-mono" font-size="14" font-weight="800" fill="#ffffff" x="14" y="46">NAV = Current Total Equity / Pool Units Issued</text>
    </g>

    <!-- Deposit Rule -->
    <g transform="translate(20, 140)">
      <rect width="385" height="65" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
      <text class="font-mono" font-size="11" font-weight="700" fill="#38bdf8" x="14" y="22">CAPITAL DEPOSIT (UNIT MINTING):</text>
      <text class="font-mono" font-size="12" font-weight="700" fill="#cbd5e1" x="14" y="44">Units Minted = Deposit Amount / Current NAV</text>
    </g>

    <!-- Withdrawal Rule -->
    <g transform="translate(20, 220)">
      <rect width="385" height="65" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3" />
      <text class="font-mono" font-size="11" font-weight="700" fill="#fbbf24" x="14" y="22">CAPITAL REDEMPTION (UNIT BURNING):</text>
      <text class="font-mono" font-size="12" font-weight="700" fill="#cbd5e1" x="14" y="44">Units Burned = Withdrawal Amount / Current NAV</text>
    </g>
  </g>

  <!-- Right: Tier 1 Buffer Defense Gate -->
  <g transform="translate(470, 25)" filter="url(#navShadow)">
    <rect width="425" height="320" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" />

    <g transform="translate(20, 20)">
      <text class="font-ui" font-size="16" font-weight="800" fill="#ffffff">TIER 1 LIQUIDITY REDEMPTION GATE</text>
      <text class="font-ui" font-size="11" fill="#94a3b8" y="20">Hard cryptographic safeguard preventing forced liquidations</text>
    </g>

    <!-- Visual Gate Flow -->
    <g transform="translate(20, 60)">
      <!-- Box 1: Investor Withdrawal Request -->
      <rect width="385" height="58" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
      <text class="font-ui" font-size="11" font-weight="600" fill="#94a3b8" x="14" y="20">INCOMING REDEMPTION REQUEST</text>
      <text class="font-mono" font-size="13" font-weight="800" fill="#ffffff" x="14" y="42">Amount: $12,500.00 USD</text>
      <text class="font-mono" font-size="11" fill="#38bdf8" x="250" y="42">NAV @ 1.1656</text>
    </g>

    <!-- Middle Gate Logic -->
    <g transform="translate(20, 130)">
      <rect width="385" height="75" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.2" />
      <text class="font-mono" font-size="11" font-weight="700" fill="#34d399" x="14" y="22">AUTOMATED LIQUIDITY VALIDATION CHECK:</text>
      <text class="font-mono" font-size="12" fill="#cbd5e1" x="14" y="42">Available Tier 1 Cash Buffer: <tspan fill="#34d399" font-weight="700">$15,000.00</tspan></text>
      <text class="font-mono" font-size="11" font-weight="700" fill="#34d399" x="14" y="62">STATUS: APPROVED • NO TRADE LIQUIDATIONS REQUIRED</text>
    </g>

    <!-- Excessive Request Safety Trigger -->
    <g transform="translate(20, 220)">
      <rect width="385" height="75" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#ef4444" stroke-width="1.2" />
      <text class="font-mono" font-size="11" font-weight="700" fill="#f87171" x="14" y="22">IF REDEMPTION &gt; TIER 1 CASH BUFFER ($15,000):</text>
      <text class="font-mono" font-size="12" font-weight="700" fill="#f87171" x="14" y="42">HTTP 400 Bad Request: "withdrawal exceeds buffer"</text>
      <text class="font-ui" font-size="11" fill="#94a3b8" x="14" y="62">Active tactical futures positions remain 100% protected.</text>
    </g>
  </g>
</svg>
