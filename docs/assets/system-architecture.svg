<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="frontendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="contextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="redisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title { font: 700 22px 'Segoe UI', sans-serif; fill: #f8fafc; }
    .subtitle { font: 400 13px 'Segoe UI', sans-serif; fill: #94a3b8; }
    .box-title { font: 700 14px 'Segoe UI', sans-serif; fill: #ffffff; }
    .box-text { font: 400 11px 'Segoe UI', sans-serif; fill: #e2e8f0; }
    .small { font: 400 10px 'Segoe UI', sans-serif; fill: #cbd5e1; }
    .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#ah); }
    .arrow-hot { stroke: #a855f7; stroke-width: 2.5; fill: none; marker-end: url(#ahp); }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a855f7" />
    </marker>
  </defs>

  <rect width="1000" height="660" fill="url(#bgGrad)" rx="14" />
  <text x="500" y="36" text-anchor="middle" class="title">Simple-Trader v3.0 • Decision Core Architecture</text>
  <text x="500" y="56" text-anchor="middle" class="subtitle">One decision core: Jev + 9Router · everything else is context · zero fallbacks</text>

  <!-- PWA -->
  <rect x="40" y="76" width="430" height="74" rx="10" fill="url(#frontendGrad)" filter="url(#dropShadow)" />
  <text x="255" y="98" text-anchor="middle" class="box-title">📱 React PWA (Bun)</text>
  <text x="255" y="116" text-anchor="middle" class="box-text">Lightweight Charts • SSE Live Stream • Dark/Light • Offline SW</text>
  <text x="255" y="136" text-anchor="middle" class="small">Nginx :80/:3000 → REST API &amp; Live SSE</text>

  <!-- Go engine -->
  <rect x="530" y="76" width="430" height="74" rx="10" fill="url(#backendGrad)" filter="url(#dropShadow)" />
  <text x="745" y="98" text-anchor="middle" class="box-title">⚡ Pure Go 1.24 Engine (Zero CGO)</text>
  <text x="745" y="116" text-anchor="middle" class="box-text">Goroutine workers • Paper Execution Engine • SSE broadcaster</text>
  <text x="745" y="136" text-anchor="middle" class="small">Port :8080 • Futures: LONG/SHORT intent → order side</text>

  <path class="arrow" d="M470,113 L526,113" />

  <!-- Context layer -->
  <rect x="40" y="186" width="920" height="118" rx="10" fill="url(#contextGrad)" filter="url(#dropShadow)" opacity="0.95" />
  <text x="500" y="208" text-anchor="middle" class="box-title">CONTEXT LAYER — no agency, read-only feeders</text>
  <text x="500" y="230" text-anchor="middle" class="box-text">News clusters (semantic labels)  ·  Indicators: RSI, MACD, BB, SuperTrend, VWAP, GK, Parkinson, KER, CMF  ·  Gates as fields</text>
  <text x="500" y="250" text-anchor="middle" class="box-text">LSTM stats feeder: historical success rates + feature impact (never votes)  ·  ATR SL/TP levels  ·  Funding, macro calendar</text>
  <text x="500" y="274" text-anchor="middle" class="small">→ builds ONE State Object per cycle · feeder failures = explicit named errors, no defaults</text>
  <text x="500" y="292" text-anchor="middle" class="small">REMOVED in v3.0: keyword lexicon • fallbackHeuristic • autonomous gates/vetoes/confluence weights</text>

  <path class="arrow" d="M745,150 L745,182" />

  <!-- Decision core -->
  <rect x="180" y="340" width="640" height="132" rx="10" fill="url(#coreGrad)" filter="url(#dropShadow)" />
  <text x="500" y="364" text-anchor="middle" class="box-title">🧠 DECISION CORE — the only decider</text>
  <text x="500" y="386" text-anchor="middle" class="box-text">Jev FIRST (System One, typed, ~0.5s): Choice LONG/SHORT/NO_TRADE · Noul exit-now/catalyst · Score severity · full distributions</text>
  <text x="500" y="406" text-anchor="middle" class="box-text">confidence &lt; threshold OR text needed → 9Router escalation (final answer, recorded)</text>
  <text x="500" y="426" text-anchor="middle" class="box-text">route recorded: jev_direct | escalated · one final writer per decision · no races</text>
  <text x="500" y="450" text-anchor="middle" class="small">news: BULLISH/BEARISH/NEUTRAL/MIXED · position intent only — BUY/SELL lives in execution layer</text>

  <path class="arrow-hot" d="M500,304 L500,336" />

  <!-- Execution -->
  <rect x="40" y="510" width="290" height="76" rx="10" fill="url(#backendGrad)" filter="url(#dropShadow)" />
  <text x="185" y="532" text-anchor="middle" class="box-title">ExecutionEngine</text>
  <text x="185" y="552" text-anchor="middle" class="box-text">position intent → BUY/SELL orders</text>
  <text x="185" y="572" text-anchor="middle" class="small">short entry = SELL · short exit = BUY</text>

  <!-- Broadcast -->
  <rect x="355" y="510" width="290" height="76" rx="10" fill="url(#frontendGrad)" filter="url(#dropShadow)" />
  <text x="500" y="532" text-anchor="middle" class="box-title">SSE + Telegram Broadcast</text>
  <text x="500" y="552" text-anchor="middle" class="box-text">entry + resolution events</text>
  <text x="500" y="572" text-anchor="middle" class="small">positions endpoint mirrors signals</text>

  <!-- Evidence -->
  <rect x="670" y="510" width="290" height="76" rx="10" fill="url(#coreGrad)" filter="url(#dropShadow)" opacity="0.9" />
  <text x="815" y="532" text-anchor="middle" class="box-title">Evidence Report (shadow)</text>
  <text x="815" y="552" text-anchor="middle" class="box-text">agreement • latency • cost • calibration</text>
  <text x="815" y="572" text-anchor="middle" class="small">gates tuning &amp; promotion (Constitution VIII)</text>

  <path class="arrow-hot" d="M350,472 L185,506" />
  <path class="arrow-hot" d="M500,472 L500,506" />
  <path class="arrow-hot" d="M650,472 L815,506" />

  <!-- Storage -->
  <rect x="40" y="610" width="430" height="36" rx="8" fill="url(#dbGrad)" />
  <text x="255" y="633" text-anchor="middle" class="box-title">PostgreSQL 16 — signals • trades • state • decisions • shadow records</text>

  <rect x="530" y="610" width="430" height="36" rx="8" fill="url(#redisGrad)" />
  <text x="745" y="633" text-anchor="middle" class="box-title">Redis 7 — tickers • indicator cache • Pub/Sub • shadow config flags</text>
</svg>
