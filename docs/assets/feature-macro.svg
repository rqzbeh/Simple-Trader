<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <linearGradient id="macroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tier1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="tier2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="tier3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="macroShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Frame Background -->
  <rect width="920" height="380" rx="14" fill="url(#macroBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Left: Dynamic 3-Tier Allocation Cards -->
  <g transform="translate(25, 25)" filter="url(#macroShadow)">
    <rect width="520" height="330" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" />

    <g transform="translate(20, 20)">
      <text class="font-sans" font-size="16" font-weight="800" fill="#ffffff">MULTI-HORIZON 3-TIER CAPITAL ALLOCATION</text>
      <text class="font-sans" font-size="11" fill="#94a3b8" y="20">Guaranteed withdrawal liquidity + inflation hedge + short-term tactical alpha</text>
    </g>

    <!-- Visual Distribution Bar -->
    <g transform="translate(20, 68)">
      <rect width="480" height="20" rx="10" fill="#1e293b" />
      <rect width="72" height="20" rx="10" fill="url(#tier1Grad)" />
      <rect x="72" width="216" height="20" fill="url(#tier2Grad)" />
      <rect x="288" width="192" height="20" rx="10" fill="url(#tier3Grad)" />

      <text class="font-mono" font-size="10" font-weight="700" fill="#ffffff" x="16" y="14">15%</text>
      <text class="font-mono" font-size="10" font-weight="700" fill="#000000" x="165" y="14">45% CORE</text>
      <text class="font-mono" font-size="10" font-weight="700" fill="#000000" x="370" y="14">40% ALPHA</text>
    </g>

    <!-- Tier Detail 1: Tier 1 Cash -->
    <g transform="translate(20, 108)">
      <rect width="480" height="60" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="24" cy="30" r="10" fill="url(#tier1Grad)" />
      <text class="font-mono" font-size="12" font-weight="800" fill="#60a5fa" x="46" y="24">TIER 1: CASH &amp; REDEMPTION BUFFER (15% • $15,000)</text>
      <text class="font-sans" font-size="11" fill="#cbd5e1" x="46" y="44">Pure USD/USDC reserve backing investor withdrawals without selling trades.</text>
    </g>

    <!-- Tier Detail 2: Tier 2 Core -->
    <g transform="translate(20, 180)">
      <rect width="480" height="60" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="24" cy="30" r="10" fill="url(#tier2Grad)" />
      <text class="font-mono" font-size="12" font-weight="800" fill="#fbbf24" x="46" y="24">TIER 2: CORE CAPITAL PRESERVATION (45% • $45,000)</text>
      <text class="font-sans" font-size="11" fill="#cbd5e1" x="46" y="44">Macro inflation hedges: PAX Gold (PAXG/USDT), BNB/USDT, and Reserve BTC.</text>
    </g>

    <!-- Tier Detail 3: Tier 3 Tactical Alpha -->
    <g transform="translate(20, 252)">
      <rect width="480" height="60" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="24" cy="30" r="10" fill="url(#tier3Grad)" />
      <text class="font-mono" font-size="12" font-weight="800" fill="#34d399" x="46" y="24">TIER 3: TACTICAL ALPHA FUTURES (40% • $40,000)</text>
      <text class="font-sans" font-size="11" fill="#cbd5e1" x="46" y="44">News-catalyst high-conviction trades, 3-hour candle setups, 1:1.5+ R:R.</text>
    </g>
  </g>

  <!-- Right: Real-World Macro Regime Dial -->
  <g transform="translate(565, 25)" filter="url(#macroShadow)">
    <rect width="330" height="330" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" />

    <g transform="translate(20, 20)">
      <text class="font-sans" font-size="15" font-weight="800" fill="#ffffff">DYNAMIC MACRO REGIME</text>
      <text class="font-sans" font-size="11" fill="#94a3b8" y="20">Real economic indicators &amp; conflict indices</text>
    </g>

    <!-- Active Regime Badge -->
    <g transform="translate(20, 65)">
      <rect width="290" height="42" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
      <circle cx="22" cy="21" r="5" fill="#10b981" />
      <text class="font-mono" font-size="13" font-weight="800" fill="#34d399" x="36" y="26">REGIME: NORMAL / EXPANSION</text>
    </g>

    <!-- Live Macro Indicators -->
    <g transform="translate(20, 125)">
      <!-- Geopolitical Stress Index -->
      <text class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">Geopolitical Conflict Index</text>
      <text class="font-mono" font-size="11" font-weight="700" fill="#f59e0b" x="255">0.38 / 1.0</text>
      <rect y="18" width="290" height="6" rx="3" fill="#1e293b" />
      <rect y="18" width="110" height="6" rx="3" fill="#f59e0b" />

      <!-- Inflation YoY -->
      <text class="font-sans" font-size="11" font-weight="600" fill="#94a3b8" y="44">Inflation Rate YoY (CPI)</text>
      <text class="font-mono" font-size="11" font-weight="700" fill="#38bdf8" x="255" y="44">2.5% YoY</text>
      <rect y="50" width="290" height="6" rx="3" fill="#1e293b" />
      <rect y="50" width="72" height="6" rx="3" fill="#38bdf8" />

      <!-- Benchmark Rate -->
      <text class="font-sans" font-size="11" font-weight="600" fill="#94a3b8" y="76">Benchmark Interest Rate</text>
      <text class="font-mono" font-size="11" font-weight="700" fill="#a855f7" x="255" y="76">4.75%</text>
      <rect y="82" width="290" height="6" rx="3" fill="#1e293b" />
      <rect y="82" width="138" height="6" rx="3" fill="#a855f7" />
    </g>

    <!-- Regime Defense Policy -->
    <g transform="translate(20, 240)">
      <rect width="290" height="70" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <text class="font-sans" font-size="11" font-weight="700" fill="#ffffff" x="12" y="20">Automated Regime Shifting:</text>
      <text class="font-sans" font-size="10.5" fill="#94a3b8" x="12" y="38">• War / Crisis: Expand Tier 2 Gold to 65%</text>
      <text class="font-sans" font-size="10.5" fill="#94a3b8" x="12" y="54">• Dovish Rate Cuts: Expand Tier 3 Alpha to 50%</text>
    </g>
  </g>
</svg>
