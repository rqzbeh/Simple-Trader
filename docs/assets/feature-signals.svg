<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <linearGradient id="sigBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="longBadgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="shortBadgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="amberCatalyst" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05" />
    </linearGradient>
    <filter id="sigShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Frame Background -->
  <rect width="920" height="380" rx="14" fill="url(#sigBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Card 1: BUY / LONG Signal -->
  <g transform="translate(25, 25)" filter="url(#sigShadow)">
    <rect width="425" height="330" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" />

    <!-- Header: Symbol & Long Badge -->
    <g transform="translate(20, 20)">
      <text class="font-mono" font-size="18" font-weight="800" fill="#ffffff">BTC/USD</text>
      <rect x="95" y="-15" width="85" height="24" rx="6" fill="url(#longBadgeGrad)" stroke="#10b981" stroke-width="1" />
      <text class="font-mono" font-size="11" font-weight="700" fill="#34d399" x="104" y="2">▲ LONG 5x</text>
      <text class="font-mono" font-size="11" fill="#64748b" x="315" y="2">#1 • ACTIVE</text>
    </g>

    <!-- Breaking News Catalyst Callout -->
    <g transform="translate(20, 55)">
      <rect width="385" height="58" rx="8" fill="url(#amberCatalyst)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
      <text class="font-sans" font-size="10" font-weight="700" fill="#f59e0b" x="12" y="18">⚡ BREAKING CATALYST (InstitutionalNewsFeed)</text>
      <text class="font-sans" font-size="11.5" font-weight="500" fill="#e2e8f0" x="12" y="38">"Fed surprise 50 bps cut &amp; 12,500 BTC whale accumulation"</text>
    </g>

    <!-- Key Execution Targets Grid -->
    <g transform="translate(20, 130)">
      <rect width="385" height="65" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
      <!-- Entry -->
      <g transform="translate(18, 16)">
        <text class="font-sans" font-size="10" font-weight="600" fill="#94a3b8">ENTRY PRICE</text>
        <text class="font-mono" font-size="14" font-weight="700" fill="#f8fafc" y="24">$65,000.00</text>
      </g>
      <!-- Stop Loss -->
      <g transform="translate(145, 16)">
        <text class="font-sans" font-size="10" font-weight="600" fill="#f87171">🛡️ STOP LOSS</text>
        <text class="font-mono" font-size="14" font-weight="700" fill="#ef4444" y="24">$63,700.00</text>
      </g>
      <!-- Take Profit -->
      <g transform="translate(265, 16)">
        <text class="font-sans" font-size="10" font-weight="600" fill="#34d399">🎯 TARGET (TP1)</text>
        <text class="font-mono" font-size="14" font-weight="700" fill="#10b981" y="24">$68,120.00</text>
      </g>
    </g>

    <!-- Position Sizing & Risk Parameters -->
    <g transform="translate(20, 215)">
      <text class="font-mono" font-size="12" fill="#94a3b8">Capital: <tspan fill="#38bdf8" font-weight="700">$21,500.00 (20.0% Alpha)</tspan></text>
      <text class="font-mono" font-size="12" fill="#94a3b8" x="240">Risk/Reward: <tspan fill="#f59e0b" font-weight="700">1:2.40</tspan></text>
      <line x1="0" y1="20" x2="385" y2="20" stroke="#1e293b" stroke-width="1" />
    </g>

    <!-- Bottom Action Area -->
    <g transform="translate(20, 260)">
      <rect width="180" height="38" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
      <text class="font-sans" font-size="12" font-weight="700" fill="#34d399" x="32" y="24">✓ Trade Monitoring</text>

      <rect x="235" y="0" width="150" height="38" rx="8" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
      <text class="font-sans" font-size="12" font-weight="700" fill="#f87171" x="260" y="24">✕ Close Position</text>
    </g>
  </g>

  <!-- Card 2: SELL / SHORT Signal -->
  <g transform="translate(470, 25)" filter="url(#sigShadow)">
    <rect width="425" height="330" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" />

    <!-- Header: Symbol & Short Badge -->
    <g transform="translate(20, 20)">
      <text class="font-mono" font-size="18" font-weight="800" fill="#ffffff">SOL/USD</text>
      <rect x="95" y="-15" width="92" height="24" rx="6" fill="url(#shortBadgeGrad)" stroke="#ef4444" stroke-width="1" />
      <text class="font-mono" font-size="11" font-weight="700" fill="#f87171" x="103" y="2">▼ SHORT 4x</text>
      <text class="font-mono" font-size="11" fill="#64748b" x="315" y="2">#2 • ACTIVE</text>
    </g>

    <!-- Breaking News Catalyst Callout -->
    <g transform="translate(20, 55)">
      <rect width="385" height="58" rx="8" fill="url(#amberCatalyst)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
      <text class="font-sans" font-size="10" font-weight="700" fill="#f59e0b" x="12" y="18">⚡ BREAKING CATALYST (WhaleAlerts)</text>
      <text class="font-sans" font-size="11.5" font-weight="500" fill="#e2e8f0" x="12" y="38">"Whale dumps 450,000 SOL across exchanges on SEC probe"</text>
    </g>

    <!-- Key Execution Targets Grid -->
    <g transform="translate(20, 130)">
      <rect width="385" height="65" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
      <!-- Entry -->
      <g transform="translate(18, 16)">
        <text class="font-sans" font-size="10" font-weight="600" fill="#94a3b8">ENTRY PRICE</text>
        <text class="font-mono" font-size="14" font-weight="700" fill="#f8fafc" y="24">$142.50</text>
      </g>
      <!-- Stop Loss -->
      <g transform="translate(145, 16)">
        <text class="font-sans" font-size="10" font-weight="600" fill="#f87171">🛡️ STOP LOSS</text>
        <text class="font-mono" font-size="14" font-weight="700" fill="#ef4444" y="24">$147.20</text>
      </g>
      <!-- Take Profit -->
      <g transform="translate(265, 16)">
        <text class="font-sans" font-size="10" font-weight="600" fill="#34d399">🎯 TARGET (TP1)</text>
        <text class="font-mono" font-size="14" font-weight="700" fill="#10b981" y="24">$131.00</text>
      </g>
    </g>

    <!-- Position Sizing & Risk Parameters -->
    <g transform="translate(20, 215)">
      <text class="font-mono" font-size="12" fill="#94a3b8">Capital: <tspan fill="#38bdf8" font-weight="700">$12,000.00 (15.0% Alpha)</tspan></text>
      <text class="font-mono" font-size="12" fill="#94a3b8" x="240">Risk/Reward: <tspan fill="#f59e0b" font-weight="700">1:2.45</tspan></text>
      <line x1="0" y1="20" x2="385" y2="20" stroke="#1e293b" stroke-width="1" />
    </g>

    <!-- Bottom Action Area -->
    <g transform="translate(20, 260)">
      <rect width="180" height="38" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
      <text class="font-sans" font-size="12" font-weight="700" fill="#34d399" x="32" y="24">✓ Trade Monitoring</text>

      <rect x="235" y="0" width="150" height="38" rx="8" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
      <text class="font-sans" font-size="12" font-weight="700" fill="#f87171" x="260" y="24">✕ Close Position</text>
    </g>
  </g>
</svg>
